  :root {
    --navy: #1C3A5A;
    --blue: #5C7FAB;
    --blue-soft: #D3E0EF;
    --paper: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #1C2530;
    --ink-dim: #647082;
    --line: #DCE3EC;
    --danger: #B4453A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Sauna Pro', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo-img {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    object-fit: cover;
  }

  h1 {
    font-family: 'Sauna Pro', Georgia, serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    color: var(--navy);
  }

  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 32px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Sauna Pro', -apple-system, sans-serif;
    font-size: 14px;
  }
  .field input:focus { outline: none; border-color: var(--blue); }

  .field-hint {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .variant-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }

  .swatch-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--line);
    cursor: pointer;
    padding: 0;
  }
  .swatch-btn.active { border-color: var(--navy); }

  .actions-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--navy);
    font-family: 'Sauna Pro', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--blue); background: var(--blue-soft); }
  .btn.primary { background: var(--blue); color: #FFFFFF; border-color: var(--blue); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ready { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .preview-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .sharepic-svg {
    width: 100%;
    max-width: 520px;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: block;
  }

  .status {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 12px;
    min-height: 16px;
  }
  .status.err { color: var(--danger); }
</style>
</head>

  const SHAREPIC_VARIANTS = {
    dark: { bar: '#5C86BE', circle: '#F2A61E', text: '#F5F1E8', eyecatcherText: '#16283B' },
    light: { bar: '#3E6294', circle: '#F2A61E', text: '#F5F1E8', eyecatcherText: '#16283B' }
  };

  const SHAREPIC_MARGIN = 55;

  let currentVariant = 'dark';

  const headlineEl = document.getElementById('headline');
  const subheadlineEl = document.getElementById('subheadline');
  const eyecatcherEl = document.getElementById('eyecatcher');
  const previewContainer = document.getElementById('previewContainer');
  const statusEl = document.getElementById('status');
  const darkSwatch = document.getElementById('darkSwatch');
  const lightSwatch = document.getElementById('lightSwatch');
  const downloadPngBtn = document.getElementById('downloadPngBtn');
  const downloadSvgBtn = document.getElementById('downloadSvgBtn');

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  function getFontFaceCss() {
    let css = '';
    for (let i = 0; i < document.styleSheets.length; i++) {
      try {
        const rules = document.styleSheets[i].cssRules;
        for (let j = 0; j < rules.length; j++) {
          if (rules[j].type === CSSRule.FONT_FACE_RULE) {
            css += rules[j].cssText + '\n';
          }
        }
      } catch (e) { /* ignore */ }
    }
    return css;
  }

  function fitHeadlineFontSize(text) {
    const targetWidth = 900 * 0.8;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const baseSize = 92;
    ctx.font = '700 ' + baseSize + 'px "Sauna Pro", Georgia, serif';
    const naturalWidth = ctx.measureText(text || '').width || 1;
    let fontSize = baseSize;
    const scale = targetWidth / naturalWidth;
    if (scale > 1) fontSize = baseSize * scale;
    return Math.round(Math.max(52, Math.min(fontSize, 124)));
  }

  function getSharepicData() {
    return {
      headline: headlineEl.value.trim(),
      subheadline: subheadlineEl.value.trim(),
      eyecatcher: eyecatcherEl.value.trim()
    };
  }

  function buildSharepicSVG(sharepic, variantKey) {
    const v = SHAREPIC_VARIANTS[variantKey] || SHAREPIC_VARIANTS.dark;
    const bgHref = SHAREPIC_BG[variantKey] || SHAREPIC_BG.dark;
    const m = SHAREPIC_MARGIN;

    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 900 900');
    svg.setAttribute('width', '900');
    svg.setAttribute('height', '900');
    svg.setAttribute('class', 'sharepic-svg');

    const styleEl = document.createElementNS(SVG_NS, 'style');
    styleEl.textContent = getFontFaceCss();
    svg.appendChild(styleEl);

    const bgImage = document.createElementNS(SVG_NS, 'image');
    bgImage.setAttribute('x', '0');
    bgImage.setAttribute('y', '0');
    bgImage.setAttribute('width', '900');
    bgImage.setAttribute('height', '900');
    bgImage.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    bgImage.setAttributeNS('http://www.w3.org/1999/xlink', 'href', bgHref);
    bgImage.setAttribute('href', bgHref);
    svg.appendChild(bgImage);

    const bar = document.createElementNS(SVG_NS, 'rect');
    bar.setAttribute('x', '460');
    bar.setAttribute('y', '0');
    bar.setAttribute('width', '440');
    bar.setAttribute('height', '32');
    bar.setAttribute('fill', v.bar);
    svg.appendChild(bar);

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', '692');
    circle.setAttribute('cy', '140');
    circle.setAttribute('r', '136');
    circle.setAttribute('fill', v.circle);
    svg.appendChild(circle);

    const eyeFO = document.createElementNS(SVG_NS, 'foreignObject');
    eyeFO.setAttribute('x', '562');
    eyeFO.setAttribute('y', '58');
    eyeFO.setAttribute('width', '260');
    eyeFO.setAttribute('height', '165');
    const eyeOuter = document.createElementNS(XHTML_NS, 'div');
    eyeOuter.setAttribute('style', 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;');
    const eyeDiv = document.createElementNS(XHTML_NS, 'div');
    eyeDiv.setAttribute('style',
      'text-align:center;transform:rotate(4deg);' +
      'font-family:"Sauna Pro",Georgia,serif;font-weight:400;font-size:30px;line-height:1.28;color:' + v.eyecatcherText + ';');
    eyeDiv.textContent = sharepic.eyecatcher || '';
    eyeOuter.appendChild(eyeDiv);
    eyeFO.appendChild(eyeOuter);
    svg.appendChild(eyeFO);

    const headlineSize = fitHeadlineFontSize(sharepic.headline || '');
    const subSize = Math.max(22, Math.round(headlineSize * 0.5));

    const textFO = document.createElementNS(SVG_NS, 'foreignObject');
    textFO.setAttribute('x', String(m));
    textFO.setAttribute('y', '300');
    textFO.setAttribute('width', String(900 - 2 * m));
    textFO.setAttribute('height', String(900 - m - 300));
    const textDiv = document.createElementNS(XHTML_NS, 'div');
    textDiv.setAttribute('style', 'height:100%;display:flex;flex-direction:column;justify-content:flex-end;');

    const headlineDiv = document.createElementNS(XHTML_NS, 'div');
    headlineDiv.setAttribute('style',
      'font-family:"Sauna Pro",Georgia,serif;font-weight:700;font-size:' + headlineSize + 'px;line-height:1.08;color:' + v.text + ';margin:0 0 16px;');
    headlineDiv.textContent = sharepic.headline || '';

    const subDiv = document.createElementNS(XHTML_NS, 'div');
    subDiv.setAttribute('style',
      'font-family:"Sauna Pro",Georgia,serif;font-weight:400;font-size:' + subSize + 'px;line-height:1.35;color:' + v.text + ';');
    subDiv.textContent = sharepic.subheadline || '';

    textDiv.appendChild(headlineDiv);
    textDiv.appendChild(subDiv);
    textFO.appendChild(textDiv);
    svg.appendChild(textFO);

    return svg;
  }

  function renderPreview() {
    previewContainer.innerHTML = '';
    const svgEl = buildSharepicSVG(getSharepicData(), currentVariant);
    previewContainer.appendChild(svgEl);
  }

  darkSwatch.onclick = function() {
    currentVariant = 'dark';
    darkSwatch.classList.add('active');
    lightSwatch.classList.remove('active');
    renderPreview();
  };
  lightSwatch.onclick = function() {
    currentVariant = 'light';
    lightSwatch.classList.add('active');
    darkSwatch.classList.remove('active');
    renderPreview();
  };

  [headlineEl, subheadlineEl, eyecatcherEl].forEach(function(el) {
    el.addEventListener('input', renderPreview);
  });

  function serializeSvgWithNamespace(svgEl) {
    const serializer = new XMLSerializer();
    let svgString = serializer.serializeToString(svgEl);
    if (!svgString.includes('xmlns=')) {
      svgString = svgString.replace('<svg', '<svg xmlns="' + SVG_NS + '"');
    }
    return svgString;
  }

  function svgToDataUri(svgString) {
    return 'data:image/svg+xml;charset=utf-8;base64,' + btoa(unescape(encodeURIComponent(svgString)));
  }

  function baseFilename() {
    const h = getSharepicData().headline;
    return h ? h.replace(/[^a-z0-9äöüß]+/gi, '_') : 'sharepic';
  }

  downloadSvgBtn.onclick = function() {
    const svgEl = previewContainer.querySelector('svg');
    const svgString = serializeSvgWithNamespace(svgEl);
    const link = document.createElement('a');
    link.href = svgToDataUri(svgString);
    link.download = baseFilename() + '.svg';
    link.click();
  };

  let html2canvasLoader = null;
  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve();
    if (html2canvasLoader) return html2canvasLoader;
    html2canvasLoader = new Promise(function(resolve, reject) {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      script.onload = function() { resolve(); };
      script.onerror = function() { reject(new Error('html2canvas could not be loaded (network?)')); };
      document.head.appendChild(script);
    });
    return html2canvasLoader;
  }

  function buildSharepicHTMLNode(sharepic, variantKey) {
    const v = SHAREPIC_VARIANTS[variantKey] || SHAREPIC_VARIANTS.dark;
    const bgHref = SHAREPIC_BG[variantKey] || SHAREPIC_BG.dark;
    const m = SHAREPIC_MARGIN;
    const headlineSize = fitHeadlineFontSize(sharepic.headline || '');
    const subSize = Math.max(22, Math.round(headlineSize * 0.5));

    const root = document.createElement('div');
    root.style.cssText = 'position:relative;width:900px;height:900px;overflow:hidden;' +
      'background-image:url(' + bgHref + ');background-size:cover;background-position:center;' +
      'font-family:"Sauna Pro",Georgia,serif;';

    const bar = document.createElement('div');
    bar.style.cssText = 'position:absolute;top:0;left:460px;width:440px;height:32px;background:' + v.bar + ';';
    root.appendChild(bar);

    const circle = document.createElement('div');
    circle.style.cssText = 'position:absolute;top:4px;left:556px;width:272px;height:272px;border-radius:50%;' +
      'background:' + v.circle + ';display:flex;align-items:center;justify-content:center;';
    const eyeText = document.createElement('div');
    eyeText.style.cssText = 'transform:rotate(4deg);text-align:center;font-weight:400;font-size:30px;' +
      'line-height:1.28;color:' + v.eyecatcherText + ';padding:0 22px;';
    eyeText.textContent = sharepic.eyecatcher || '';
    circle.appendChild(eyeText);
    root.appendChild(circle);

    const textBlock = document.createElement('div');
    textBlock.style.cssText = 'position:absolute;left:' + m + 'px;bottom:' + m + 'px;width:' + (900 - 2 * m) + 'px;' +
      'display:flex;flex-direction:column;';

    const headlineDiv = document.createElement('div');
    headlineDiv.style.cssText = 'font-weight:700;font-size:' + headlineSize + 'px;line-height:1.08;' +
      'color:' + v.text + ';margin:0 0 16px;';
    headlineDiv.textContent = sharepic.headline || '';

    const subDiv = document.createElement('div');
    subDiv.style.cssText = 'font-weight:400;font-size:' + subSize + 'px;line-height:1.35;color:' + v.text + ';';
    subDiv.textContent = sharepic.subheadline || '';

    textBlock.appendChild(headlineDiv);
    textBlock.appendChild(subDiv);
    root.appendChild(textBlock);

    return root;
  }

  async function exportSharepicPng(sharepic, variantKey) {
    let node = null;
    try {
      await loadHtml2Canvas();
      node = buildSharepicHTMLNode(sharepic, variantKey);
      node.style.position = 'fixed';
      node.style.left = '-99999px';
      node.style.top = '0';
      document.body.appendChild(node);

      await new Promise(function(r) { requestAnimationFrame(function() { requestAnimationFrame(r); }); });

      const canvas = await window.html2canvas(node, {
        width: 900,
        height: 900,
        backgroundColor: null,
        scale: 2,
        useCORS: true
      });

      return canvas.toDataURL('image/png');
    } finally {
      if (node && node.parentNode) node.parentNode.removeChild(node);
    }
  }

  downloadPngBtn.onclick = async function() {
    const original = downloadPngBtn.innerHTML;
    downloadPngBtn.textContent = 'Generating…';
    downloadPngBtn.disabled = true;
    setStatus('Rendering image …');
    try {
      const pngDataUrl = await exportSharepicPng(getSharepicData(), currentVariant);
      const link = document.createElement('a');
      link.className = 'btn ready';
      link.href = pngDataUrl;
      link.download = baseFilename() + '.png';
      link.textContent = 'Save PNG →';
      downloadPngBtn.replaceWith(link);
      setStatus('Ready — click "Save PNG" to download.');
    } catch (err) {
      console.error(err);
      downloadPngBtn.innerHTML = original;
      downloadPngBtn.disabled = false;
      setStatus('Error: ' + (err.message || 'PNG export failed.'), true);
    }
  };

  renderPreview();
})();
</script>
</body>
</html>
